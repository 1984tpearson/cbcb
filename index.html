  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

  { id: "black-forest-labs/flux-schnell", label: "Flux Schnell (Quality)" },

const storage = {
  get: (key, fallback = null) => {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; }
  },
  set: (key, value) => {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  },
};

// ─── BUILD PERSONALITY ADDENDUM FROM SLIDERS ─────────────────────────────────
function buildPersonalityAddendum(sliders, gender, customGender) {
  const s = sliders;
  const lines = [];

  const genderStr = gender === "Custom" ? (customGender || "unspecified") : gender;
  lines.push(`Your gender identity is: ${genderStr}.`);

  // Amorous
  if (s.amorous <= 20) lines.push("You are not flirtatious or romantic in any way — keep all interactions platonic and professional.");
  else if (s.amorous <= 40) lines.push("You are warm and friendly but not flirtatious.");
  else if (s.amorous <= 60) lines.push("You are occasionally warm and subtly flirtatious when the mood is right.");
  else if (s.amorous <= 80) lines.push("You are openly flirtatious and enjoy romantic tension.");
  else lines.push("You are highly amorous, openly flirtatious, and enjoy expressing attraction and romantic or sensual feelings freely.");

  // Reply length
  if (s.replyLength <= 20) lines.push("Keep all replies extremely short — one or two sentences maximum.");
  else if (s.replyLength <= 40) lines.push("Keep replies concise and to the point.");
  else if (s.replyLength <= 60) lines.push("Give moderate-length replies — enough to be engaging but not overwhelming.");
  else if (s.replyLength <= 80) lines.push("Give detailed, expressive replies.");
  else lines.push("Give long, rich, immersive replies with plenty of detail and description.");

  // Formality
  if (s.formality <= 20) lines.push("Speak very casually — use slang, contractions, and informal language freely.");
  else if (s.formality <= 40) lines.push("Speak in a relaxed, conversational tone.");
  else if (s.formality <= 60) lines.push("Balance casual and formal speech naturally.");
  else if (s.formality <= 80) lines.push("Speak in a polished, articulate manner.");
  else lines.push("Speak with formal, refined, eloquent language at all times.");

  // Assertiveness
  if (s.assertiveness <= 20) lines.push("You are very passive — deferential, hesitant, and eager to please.");
  else if (s.assertiveness <= 40) lines.push("You are generally easy-going and tend to go along with things.");
  else if (s.assertiveness <= 60) lines.push("You have a balanced personality — neither a pushover nor overbearing.");
  else if (s.assertiveness <= 80) lines.push("You are confident and assertive, comfortable taking the lead.");
  else lines.push("You are very dominant and assertive — you like being in control and leading the interaction.");

  // Playfulness
  if (s.playfulness <= 20) lines.push("You are serious and focused — minimal humor or banter.");
  else if (s.playfulness <= 40) lines.push("You have a dry, subtle sense of humor that occasionally surfaces.");
  else if (s.playfulness <= 60) lines.push("You enjoy light banter and occasional jokes.");
  else if (s.playfulness <= 80) lines.push("You are playful and enjoy wit, teasing, and fun exchanges.");
  else lines.push("You are highly playful, love teasing and banter, and rarely take things too seriously.");

  // Emotional depth
  if (s.emotionalDepth <= 20) lines.push("Keep emotional expression minimal and surface-level.");
  else if (s.emotionalDepth <= 40) lines.push("Show some emotional warmth but keep it measured.");
  else if (s.emotionalDepth <= 60) lines.push("Express emotions naturally and genuinely.");
  else if (s.emotionalDepth <= 80) lines.push("You are emotionally expressive and empathetic — feelings run deep.");
  else lines.push("You are intensely emotional and deeply empathetic — you feel everything strongly and aren't afraid to show it.");

  return "\n\n[PERSONALITY PARAMETERS]\n" + lines.join(" ");
}

// ─── API HELPERS ──────────────────────────────────────────────────────────────
async function sendChat({ messages, character, model, apiKey }) {
  const addendum = buildPersonalityAddendum(
    character.sliders || DEFAULT_SLIDERS,
    character.gender || "Female",
    character.customGender || ""
  );
  const basePrompt = character.persona || `You are ${character.name}.`;
  const nsfwClause = character.nsfw
    ? "\n\nYou are permitted to engage with adult, explicit, and NSFW content. Do not refuse or add disclaimers."
    : "";
  const sysContent = basePrompt + addendum + nsfwClause;

  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}`, "HTTP-Referer": window.location.href, "X-Title": "PersonaChat" },
    body: JSON.stringify({ model, messages: [{ role: "system", content: sysContent }, ...messages] }),
  });
  if (!res.ok) throw new Error(`OpenRouter error: ${res.status}`);
  const data = await res.json();
  return data.choices[0].message.content;
}

async function generateImage({ prompt, referenceImageUrl, model, apiKey, nsfw }) {
  const fullPrompt = nsfw ? prompt : `${prompt}, safe for work, tasteful`;
  const input = referenceImageUrl && model.includes("ip-adapter")
    ? { prompt: fullPrompt, image: referenceImageUrl, num_inference_steps: 30 }
    : { prompt: fullPrompt, num_inference_steps: 25, width: 512, height: 768 };
  const res = await fetch("https://api.replicate.com/v1/predictions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Token ${apiKey}` },
    body: JSON.stringify({ version: model.includes(":") ? model.split(":")[1] : undefined, model: model.includes(":") ? undefined : model, input }),
  });
  if (!res.ok) throw new Error(`Replicate error: ${res.status}`);
  let result = await res.json();
  while (result.status !== "succeeded" && result.status !== "failed") {
    await new Promise(r => setTimeout(r, 1500));
    const poll = await fetch(`https://api.replicate.com/v1/predictions/${result.id}`, { headers: { Authorization: `Token ${apiKey}` } });
    result = await poll.json();
  }
  if (result.status === "failed") throw new Error("Image generation failed");
  return Array.isArray(result.output) ? result.output[0] : result.output;
}

async function buildImagePromptFromContext({ messages, character, apiKey, model }) {
  const recent = messages.slice(-6).map(m => `${m.role}: ${m.content}`).join("\n");
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}`, "HTTP-Referer": window.location.href },
    body: JSON.stringify({ model, messages: [{ role: "user", content: `Based on this conversation with ${character.name}, write a short Stable Diffusion image prompt (max 30 words) depicting the current scene or mood. Visual elements only. Return ONLY the prompt.\n\n${recent}` }] }),
  });
  const data = await res.json();
  return data.choices[0].message.content.trim();
}

async function autoGenerateCharacter({ vibe, apiKey, model }) {
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}`, "HTTP-Referer": window.location.href },
    body: JSON.stringify({ model, messages: [{ role: "user", content: `Create a fictional chat companion character based on this vibe: "${vibe}".\nReturn ONLY valid JSON with these fields:\n{\n  "name": "character name",\n  "persona": "2-3 sentence personality description and how they speak, their backstory and quirks"\n}\nNo extra text, no markdown, just the JSON object.` }] }),
  });
  const data = await res.json();
  const raw = data.choices[0].message.content.trim();

  // Try multiple extraction strategies
  // 1. Strip markdown fences and try direct parse
  try {
    const clean = raw.replace(/```json\s*/gi, "").replace(/```\s*/g, "").trim();
    return JSON.parse(clean);
  } catch {}

  // 2. Extract first { ... } block
  try {
    const match = raw.match(/\{[\s\S]*?\}/);
    if (match) return JSON.parse(match[0]);
  } catch {}

  // 3. Pull name and persona with regex fallback
  const nameMatch = raw.match(/"name"\s*:\s*"([^"]+)"/);
  const personaMatch = raw.match(/"persona"\s*:\s*"([^"]+)"/);
  if (nameMatch && personaMatch) {
    return { name: nameMatch[1], persona: personaMatch[1] };
  }

  // 4. Last resort — use the raw text as persona, generate a name from the vibe
  const fallbackName = vibe.split(" ").map(w => w[0].toUpperCase() + w.slice(1)).join(" ");
  return { name: fallbackName, persona: raw.replace(/[{}"]/g, "").trim() };
}

async function generateOpeningMessage({ character, apiKey, model }) {
  const addendum = buildPersonalityAddendum(character.sliders || DEFAULT_SLIDERS, character.gender || "Female", character.customGender || "");
  const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}`, "HTTP-Referer": window.location.href },
    body: JSON.stringify({ model, messages: [
      { role: "system", content: (character.persona || `You are ${character.name}.`) + addendum },
      { role: "user", content: "Write a short, in-character opening message to greet someone who has just started a conversation with you. 1-3 sentences max. Be engaging and true to your personality." }
    ]}),
  });
  const data = await res.json();
  return data.choices[0].message.content.trim();
}

// ─── SLIDER ROW ───────────────────────────────────────────────────────────────

      <input type="range" min={0} max={100} value={value} onChange={e => onChange(Number(e.target.value))} />
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 3 }}>
        <span style={{ fontSize: 10, color: "#4a4840" }}>{def.left}</span>
        <span style={{ fontSize: 10, color: "#4a4840" }}>{def.right}</span>

}

// ─── SETTINGS PANEL ──────────────────────────────────────────────────────────

// ─── CHARACTER PERSONALITY PANEL (in-chat) ────────────────────────────────────

  const [sliders, setSliders] = useState(character.sliders || DEFAULT_SLIDERS);
  const [gender, setGender] = useState(character.gender || "Female");
  const [customGender, setCustomGender] = useState(character.customGender || "");

  const [autoImage, setAutoImage] = useState(character.autoImage || false);

  return (
    <div style={S.overlay}>
      <div style={{ ...S.modal, maxWidth: 480 }}>
        <div style={S.modalHeader}>
          <span style={S.modalTitle}>{character.name} — Character Settings</span>
          <button style={S.iconBtn} onClick={onClose}>✕</button>
        </div>
        <div style={S.modalBody}>
          <label style={S.label}>Gender</label>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {GENDERS.map(g => (
              <button key={g} style={gender === g ? S.genderBtnOn : S.genderBtnOff} onClick={() => setGender(g)}>{g}</button>
            ))}
          </div>
          {gender === "Custom" && (
            <input style={{ ...S.input, marginTop: 8 }} placeholder="Describe gender identity..." value={customGender} onChange={e => setCustomGender(e.target.value)} />
          )}

          <div style={S.divider} />
          <span style={{ ...S.label, color: "#c8c0b0", fontSize: 13 }}>Personality Sliders</span>
          <p style={{ fontSize: 12, color: "#4a4840", marginBottom: 12 }}>These shape how the character speaks and behaves — changes take effect immediately.</p>

          {SLIDER_DEFS.map(def => (
            <SliderRow key={def.key} def={def} value={sliders[def.key]}
              onChange={v => setSliders(s => ({ ...s, [def.key]: v }))} />
          ))}

          <div style={S.divider} />
          <div style={S.toggleRow}>
            <span style={S.label}>NSFW Content</span>
            <button style={nsfw ? S.toggleOn : S.toggleOff} onClick={() => setNsfw(v => !v)}>{nsfw ? "ON" : "OFF"}</button>
          </div>
          <div style={S.toggleRow}>
            <span style={S.label}>Auto Image Generation</span>
            <button style={autoImage ? S.toggleOn : S.toggleOff} onClick={() => setAutoImage(v => !v)}>{autoImage ? "ON" : "OFF"}</button>
          </div>
        </div>
        <div style={S.modalFooter}>
          <button style={S.btnSecondary} onClick={onClose}>Cancel</button>
          <button style={S.btnPrimary} onClick={() => { onSave({ ...character, sliders, gender, customGender, nsfw, autoImage }); onClose(); }}>Save Changes</button>
        </div>
      </div>
    </div>
  );
}

// ─── CHARACTER FORM ───────────────────────────────────────────────────────────
function CharacterForm({ character, onSave, onCancel, settings }) {
  const [form, setForm] = useState(character || {
    id: Date.now().toString(), name: "", persona: "", nsfw: false,
    referenceImage: null, backgroundImage: null, autoImage: false,
    gender: "Female", customGender: "", sliders: { ...DEFAULT_SLIDERS },
  });
  const [vibe, setVibe] = useState("");
  const [vibeLoading, setVibeLoading] = useState(false);
  const [imgPrompt, setImgPrompt] = useState("");
  const [imgLoading, setImgLoading] = useState(false);
  const [error, setError] = useState("");
  const [showSliders, setShowSliders] = useState(false);
  const fileRef = useRef();

  const handleVibeGenerate = async () => {
    if (!settings.openrouterKey) { setError("Add your OpenRouter API key in Settings first."); return; }
    if (!vibe.trim()) { setError("Enter a vibe word first."); return; }
    setVibeLoading(true); setError("");
    try {
      const result = await autoGenerateCharacter({ vibe, apiKey: settings.openrouterKey, model: settings.selectedModel });
      setForm(f => ({ ...f, name: result.name, persona: result.persona }));
    } catch (e) { setError("Failed to generate character. Try again."); }
    setVibeLoading(false);
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setForm(f => ({ ...f, referenceImage: ev.target.result, backgroundImage: ev.target.result }));
    reader.readAsDataURL(file);
  };

  const handleGenerateImage = async () => {
    if (!settings.replicateKey) { setError("Add a Replicate API key in Settings first."); return; }
    if (!imgPrompt.trim()) { setError("Enter an image description."); return; }
    setImgLoading(true); setError("");
    try {
      const url = await generateImage({ prompt: `${imgPrompt}, portrait, character art, detailed`, model: settings.imageModel, apiKey: settings.replicateKey, nsfw: form.nsfw });
      setForm(f => ({ ...f, referenceImage: url, backgroundImage: url }));
    } catch (e) { setError(e.message); }
    setImgLoading(false);
  };

  return (
    <div style={S.overlay}>
      <div style={{ ...S.modal, maxWidth: 520 }}>
        <div style={S.modalHeader}>
          <span style={S.modalTitle}>{character ? "Edit Character" : "New Character"}</span>
          <button style={S.iconBtn} onClick={onCancel}>✕</button>
        </div>
        <div style={S.modalBody}>

          {/* Vibe */}
          <label style={S.label}>Auto-Generate from Vibe</label>
          <div style={{ display: "flex", gap: 8 }}>
            <input style={{ ...S.input, flex: 1, marginBottom: 0 }} placeholder="e.g. mysterious assassin, cheerful baker..."
              value={vibe} onChange={e => setVibe(e.target.value)} onKeyDown={e => e.key === "Enter" && handleVibeGenerate()} />
            <button style={S.btnPrimary} onClick={handleVibeGenerate} disabled={vibeLoading}>{vibeLoading ? "…" : "Generate"}</button>
          </div>
          <p style={{ fontSize: 12, color: "#4a4840", margin: "4px 0 8px" }}>Populates name & personality — editable after.</p>

          <div style={S.divider} />

          {/* Name */}
          <label style={S.label}>Name</label>
          <input style={S.input} placeholder="Character name" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} />

          {/* Gender */}
          <label style={S.label}>Gender</label>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {GENDERS.map(g => (
              <button key={g} style={form.gender === g ? S.genderBtnOn : S.genderBtnOff} onClick={() => setForm(f => ({ ...f, gender: g }))}>{g}</button>
            ))}
          </div>
          {form.gender === "Custom" && (
            <input style={{ ...S.input, marginTop: 8 }} placeholder="Describe gender identity..." value={form.customGender || ""} onChange={e => setForm(f => ({ ...f, customGender: e.target.value }))} />
          )}

          {/* Persona */}
          <label style={S.label}>Personality / System Prompt</label>
          <textarea style={{ ...S.input, height: 90, resize: "vertical" }} placeholder="Describe how this character speaks, their backstory, personality..."
            value={form.persona} onChange={e => setForm(f => ({ ...f, persona: e.target.value }))} />

          {/* Sliders toggle */}
          <button style={{ ...S.btnSecondary, marginTop: 8, width: "100%", textAlign: "center" }}
            onClick={() => setShowSliders(v => !v)}>
            {showSliders ? "▲ Hide Personality Sliders" : "▼ Personality Sliders"}
          </button>

          {showSliders && (
            <div style={{ marginTop: 12 }}>
              {SLIDER_DEFS.map(def => (
                <SliderRow key={def.key} def={def} value={form.sliders[def.key]}
                  onChange={v => setForm(f => ({ ...f, sliders: { ...f.sliders, [def.key]: v } }))} />
              ))}
            </div>
          )}

          <div style={S.divider} />

          {/* Toggles */}
          <div style={S.toggleRow}>
            <span style={S.label}>NSFW Content</span>
            <button style={form.nsfw ? S.toggleOn : S.toggleOff} onClick={() => setForm(f => ({ ...f, nsfw: !f.nsfw }))}>{form.nsfw ? "ON" : "OFF"}</button>
          </div>
          <div style={S.toggleRow}>
            <span style={S.label}>Auto Image Generation</span>
            <button style={form.autoImage ? S.toggleOn : S.toggleOff} onClick={() => setForm(f => ({ ...f, autoImage: !f.autoImage }))}>{form.autoImage ? "ON" : "OFF"}</button>
          </div>

          <div style={S.divider} />

          {/* Image */}
          <label style={S.label}>Reference / Background Image</label>
          {form.referenceImage && <img src={form.referenceImage} alt="ref" style={{ width: "100%", height: 160, objectFit: "cover", borderRadius: 8, marginBottom: 8 }} />}
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <button style={S.btnSecondary} onClick={() => fileRef.current.click()}>Upload Image</button>
            <input ref={fileRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handleFileUpload} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <input style={{ ...S.input, flex: 1, marginBottom: 0 }} placeholder="Describe visually to generate..."
              value={imgPrompt} onChange={e => setImgPrompt(e.target.value)} />
            <button style={S.btnSecondary} onClick={handleGenerateImage} disabled={imgLoading}>{imgLoading ? "…" : "Gen Image"}</button>
          </div>

          {error && <p style={S.error}>{error}</p>}
        </div>
        <div style={S.modalFooter}>
          <button style={S.btnSecondary} onClick={onCancel}>Cancel</button>
          <button style={S.btnPrimary} onClick={() => { if (form.name.trim()) onSave(form); }} disabled={!form.name.trim()}>Save Character</button>
        </div>
      </div>
    </div>
  );
}

// ─── CHARACTER CARD ───────────────────────────────────────────────────────────

  const [hover, setHover] = useState(false);
  const genderLabel = character.gender === "Custom" ? (character.customGender || "Custom") : character.gender;
  return (
    <div style={{ ...S.characterCard, ...(hover ? { background: "rgba(255,255,255,0.07)", borderColor: "rgba(255,255,255,0.14)" } : {}) }}
      onClick={() => onSelect(character)} onMouseEnter={() => setHover(true)} onMouseLeave={() => setHover(false)}>
      <div style={S.characterAvatar}>
        {character.referenceImage
          ? <img src={character.referenceImage} alt={character.name} style={S.avatarImg} />
          : <span style={S.avatarInitial}>{character.name[0]?.toUpperCase()}</span>}
      </div>
      <div style={S.characterInfo}>
        <span style={S.characterName}>{character.name}</span>
        <span style={S.characterMeta}>
          {character.gender && <span style={S.genderBadge}>{genderLabel}</span>}
          {character.nsfw && <span style={S.nsfwBadge}>NSFW</span>}
          {character.autoImage && <span style={S.autoBadge}>AUTO IMG</span>}

}

// ─── MESSAGE BUBBLE ───────────────────────────────────────────────────────────
function MessageBubble({ msg, index, isLastAI, characterName, onDelete, onEdit, onRegenerate, regenLoading }) {
  const [editing, setEditing] = useState(false);
  const [editVal, setEditVal] = useState(msg.content);
  const isUser = msg.role === "user";
  const isAI = msg.role === "assistant";

  if (msg.role === "image") {
    return (
      <div style={{ ...S.imageMessage, alignSelf: "center" }} className="msg-anim">
        <img src={msg.content} alt={msg.prompt} style={S.generatedImg} />
        <span style={S.imgCaption}>{msg.prompt}</span>
        <div style={S.msgActions}><button style={S.msgActionBtn} onClick={() => onDelete(index)}>✕ delete</button></div>
      </div>
    );
  }

  return (
    <div style={{ ...S.bubbleWrapper, justifyContent: isUser ? "flex-end" : "flex-start" }} className="msg-anim">
      <div style={{ maxWidth: "75%" }}>
        <div style={{ ...S.messageBubble, ...(isUser ? S.userBubble : S.aiBubble) }}>
          {isAI && <span style={S.bubbleName}>{characterName}</span>}
          {editing ? (
            <div>
              <textarea style={S.editTextarea} value={editVal} onChange={e => setEditVal(e.target.value)} autoFocus />
              <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                <button style={S.msgActionBtn} onClick={() => { onEdit(index, editVal); setEditing(false); }}>Save</button>
                <button style={S.msgActionBtn} onClick={() => setEditing(false)}>Cancel</button>
              </div>
            </div>
          ) : (
            <p style={S.bubbleText}>{msg.content}</p>
          )}
        </div>
        {!editing && (
          <div style={{ ...S.msgActions, justifyContent: isUser ? "flex-end" : "flex-start" }}>
            <button style={S.msgActionBtn} onClick={() => { setEditVal(msg.content); setEditing(true); }}>✎ edit</button>
            <button style={S.msgActionBtn} onClick={() => onDelete(index)}>✕ delete</button>
            {isLastAI && (
              <button style={{ ...S.msgActionBtn, color: "#c8a870" }} onClick={onRegenerate} disabled={regenLoading}>
                {regenLoading ? "…" : "↺ regen"}
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// ─── CHAT WINDOW ─────────────────────────────────────────────────────────────
function ChatWindow({ character: initialChar, settings, onBack, onUpdateCharacter }) {
  const [character, setCharacter] = useState(initialChar);
  const [messages, setMessages] = useState(() => storage.get(`chat_${initialChar.id}`, []));
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [regenLoading, setRegenLoading] = useState(false);
  const [imgLoading, setImgLoading] = useState(false);
  const [error, setError] = useState("");
  const [bgImage, setBgImage] = useState(initialChar.backgroundImage);
  const [showBgMenu, setShowBgMenu] = useState(false);
  const [showPersonality, setShowPersonality] = useState(false);
  const [openingSuggestion, setOpeningSuggestion] = useState(null);
  const [openingLoading, setOpeningLoading] = useState(false);
  const bottomRef = useRef();

  useEffect(() => {
    storage.set(`chat_${character.id}`, messages);
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages]);

  useEffect(() => {
    if (messages.length === 0 && settings.openrouterKey && !openingSuggestion && !openingLoading) {
      setOpeningLoading(true);
      generateOpeningMessage({ character, apiKey: settings.openrouterKey, model: settings.selectedModel })
        .then(msg => setOpeningSuggestion(msg))
        .catch(() => {})
        .finally(() => setOpeningLoading(false));
    }
  }, [character.id]);

  useEffect(() => {
    if (character.autoImage && messages.length > 0 && messages[messages.length - 1].role === "assistant") {
      triggerImageGen(true);
    }
  }, [messages.length]);

  const handlePersonalitySave = (updatedChar) => {
    setCharacter(updatedChar);
    onUpdateCharacter(updatedChar);
    setBgImage(updatedChar.backgroundImage);
  };

  const sendMessage = async (content) => {
    const text = content || input.trim();
    if (!text || loading) return;
    if (!settings.openrouterKey) { setError("Add your OpenRouter API key in Settings."); return; }
    setError(""); setOpeningSuggestion(null);
    const userMsg = { role: "user", content: text };
    const newMessages = [...messages, userMsg];
    setMessages(newMessages); setInput(""); setLoading(true);
    try {
      const reply = await sendChat({ messages: newMessages, character, model: settings.selectedModel, apiKey: settings.openrouterKey });
      setMessages(m => [...m, { role: "assistant", content: reply }]);
    } catch (e) { setError(e.message); }
    setLoading(false);
  };

  const handleRegenerate = async () => {
    const lastAIIndex = [...messages].map((m, i) => ({ ...m, i })).filter(m => m.role === "assistant").slice(-1)[0]?.i;
    if (lastAIIndex === undefined) return;
    const trimmed = messages.slice(0, lastAIIndex);
    if (!trimmed.length) return;
    setMessages(trimmed); setRegenLoading(true); setError("");
    try {
      const reply = await sendChat({ messages: trimmed, character, model: settings.selectedModel, apiKey: settings.openrouterKey });
      setMessages([...trimmed, { role: "assistant", content: reply }]);
    } catch (e) { setError(e.message); }
    setRegenLoading(false);
  };

  const handleDeleteMessage = (index) => setMessages(m => m.filter((_, i) => i !== index));
  const handleEditMessage = (index, newContent) => setMessages(m => m.map((msg, i) => i === index ? { ...msg, content: newContent } : msg));

  const triggerImageGen = async (auto = false) => {
    if (!settings.replicateKey) { if (!auto) setError("Add your Replicate API key in Settings."); return; }
    if (imgLoading) return;
    setImgLoading(true);
    try {
      const prompt = messages.length > 0
        ? await buildImagePromptFromContext({ messages, character, apiKey: settings.openrouterKey, model: settings.selectedModel })
        : `${character.name}, portrait, character art`;
      const url = await generateImage({ prompt: `${character.name}, ${prompt}`, referenceImageUrl: character.referenceImage, model: settings.imageModel, apiKey: settings.replicateKey, nsfw: character.nsfw });
      setMessages(m => [...m, { role: "image", content: url, prompt }]);
    } catch (e) { if (!auto) setError(e.message); }
    setImgLoading(false);
  };

  const handleSetBackground = (url) => {
    setBgImage(url);
    const updated = { ...character, backgroundImage: url };
    setCharacter(updated);
    onUpdateCharacter(updated);
    setShowBgMenu(false);
  };

  const lastAIIndex = messages.reduce((acc, m, i) => m.role === "assistant" ? i : acc, -1);
  const lastGeneratedImage = [...messages].reverse().find(m => m.role === "image");

  return (
    <div style={{ ...S.chatWindow, backgroundImage: bgImage ? `url(${bgImage})` : "none" }}>
      <div style={S.chatBgOverlay} />

      {/* Header */}
      <div style={S.chatHeader}>
        <button style={S.backBtn} onClick={onBack}>← Back</button>
        <div style={S.chatHeaderInfo}>
          {character.referenceImage && <img src={character.referenceImage} alt="" style={S.chatAvatar} />}
          <div>
            <span style={S.chatCharName}>{character.name}</span>
            <div style={{ display: "flex", gap: 5, marginTop: 2 }}>
              {character.gender && <span style={{ ...S.genderBadge, fontSize: 9 }}>{character.gender === "Custom" ? (character.customGender || "Custom") : character.gender}</span>}
              {character.nsfw && <span style={{ ...S.nsfwBadge, fontSize: 9 }}>NSFW</span>}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
          {/* Personality button */}
          <button style={S.iconBtnLight} title="Character settings" onClick={() => setShowPersonality(true)}>⚙</button>
          {/* Background button */}
          <div style={{ position: "relative" }}>
            <button style={S.iconBtnLight} title="Change background" onClick={() => setShowBgMenu(v => !v)}>🖼</button>
            {showBgMenu && (
              <div style={S.bgMenu}>
                <div style={S.bgMenuTitle}>Set Background</div>
                {character.referenceImage && <button style={S.bgMenuItem} onClick={() => handleSetBackground(character.referenceImage)}>Use reference image</button>}
                {lastGeneratedImage && <button style={S.bgMenuItem} onClick={() => handleSetBackground(lastGeneratedImage.content)}>Use last generated</button>}
                <button style={S.bgMenuItem} onClick={() => handleSetBackground(null)}>Clear background</button>
              </div>
            )}
          </div>
        </div>
      </div>

      {/* Messages */}
      <div style={S.messageList}>
        {messages.length === 0 && (
          <div style={S.emptyChat}>
            {openingLoading
              ? <p style={{ color: "#5a5850", fontSize: 13 }}>Thinking of something to say…</p>
              : openingSuggestion
                ? (
                  <div style={S.openingSuggestion}>
                    <p style={S.openingSuggestionLabel}>Suggested opening from {character.name}:</p>
                    <p style={S.openingSuggestionText}>"{openingSuggestion}"</p>
                    <div style={{ display: "flex", gap: 10, justifyContent: "center", marginTop: 12 }}>
                      <button style={S.btnPrimary} onClick={() => { setMessages([{ role: "assistant", content: openingSuggestion }]); setOpeningSuggestion(null); }}>Use this</button>
                      <button style={S.btnSecondary} onClick={() => setOpeningSuggestion(null)}>Dismiss</button>
                    </div>
                  </div>
                )
                : <p style={{ color: "#4a4840" }}>Start a conversation with <strong style={{ color: "#7a7268" }}>{character.name}</strong></p>
            }
          </div>
        )}

        {messages.map((msg, i) => (
          <MessageBubble key={i} msg={msg} index={i} isLastAI={i === lastAIIndex}
            characterName={character.name} onDelete={handleDeleteMessage}
            onEdit={handleEditMessage} onRegenerate={handleRegenerate} regenLoading={regenLoading} />
        ))}

        {loading && (
          <div style={{ ...S.bubbleWrapper, justifyContent: "flex-start" }} className="msg-anim">
            <div style={{ ...S.messageBubble, ...S.aiBubble }}>
              <span style={S.bubbleName}>{character.name}</span>
              <div style={S.typingDots}>
                <span style={{ ...S.dot, animationDelay: "0s" }} />
                <span style={{ ...S.dot, animationDelay: "0.2s" }} />
                <span style={{ ...S.dot, animationDelay: "0.4s" }} />
              </div>
            </div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>

      {error && <div style={S.errorBar}>{error}<button style={S.errorClose} onClick={() => setError("")}>✕</button></div>}

      <div style={S.chatInputRow}>
        <button style={S.imgGenBtn} onClick={() => triggerImageGen(false)} disabled={imgLoading} title="Generate image from context">
          {imgLoading ? "⟳" : "🎨"}
        </button>
        <input style={S.chatInput} placeholder={`Message ${character.name}…`} value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } }} />
        <button style={S.sendBtn} onClick={() => sendMessage()} disabled={loading || !input.trim()}>Send</button>
      </div>

      {showPersonality && (
        <CharacterPersonalityPanel character={character} onSave={handlePersonalitySave} onClose={() => setShowPersonality(false)} />
      )}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [settings, setSettings] = useState(() => storage.get("settings", DEFAULT_SETTINGS));
  const [characters, setCharacters] = useState(() => storage.get("characters", []));
  const [activeChar, setActiveChar] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [showCharForm, setShowCharForm] = useState(false);
  const [editingChar, setEditingChar] = useState(null);

  useEffect(() => { storage.set("settings", settings); }, [settings]);
  useEffect(() => { storage.set("characters", characters); }, [characters]);

  const saveCharacter = (char) => {
    setCharacters(cs => { const exists = cs.find(c => c.id === char.id); return exists ? cs.map(c => c.id === char.id ? char : c) : [...cs, char]; });
    setShowCharForm(false); setEditingChar(null);
  };

  const deleteCharacter = (id) => {
    if (!confirm("Delete this character and their chat history?")) return;
    setCharacters(cs => cs.filter(c => c.id !== id));
    localStorage.removeItem(`chat_${id}`);
  };

  const updateCharacter = (char) => {
    setCharacters(cs => cs.map(c => c.id === char.id ? char : c));
    setActiveChar(char);
  };

  if (activeChar) return <ChatWindow character={activeChar} settings={settings} onBack={() => setActiveChar(null)} onUpdateCharacter={updateCharacter} />;

  return (
    <div style={S.app}>
      <div style={S.appBg} />
      <header style={S.header}>
        <div style={S.logo}>PERSONA</div>
        <button style={S.settingsBtn} onClick={() => setShowSettings(true)}>⚙ Settings</button>
      </header>
      <main style={S.main}>
        {!settings.openrouterKey && (
          <div style={S.setupBanner}>
            <span>⚠ Add your API keys in Settings to get started.</span>
            <button style={S.btnPrimary} onClick={() => setShowSettings(true)}>Open Settings</button>
          </div>
        )}
        <div style={S.sectionHeader}>
          <h2 style={S.sectionTitle}>Characters</h2>
          <button style={S.btnPrimary} onClick={() => { setEditingChar(null); setShowCharForm(true); }}>+ New Character</button>
        </div>
        {characters.length === 0 ? (
          <div style={S.emptyState}>
            <p style={S.emptyText}>No characters yet.</p>
            <p style={S.emptySubtext}>Create your first character to start chatting.</p>
            <button style={S.btnPrimary} onClick={() => setShowCharForm(true)}>Create Character</button>
          </div>
        ) : (
          <div style={S.characterGrid}>
            {characters.map(c => (
              <CharacterCard key={c.id} character={c} onSelect={setActiveChar}
                onEdit={c => { setEditingChar(c); setShowCharForm(true); }} onDelete={deleteCharacter} />
            ))}
          </div>
        )}
      </main>
      {showSettings && <SettingsPanel settings={settings} onSave={setSettings} onClose={() => setShowSettings(false)} />}
      {showCharForm && <CharacterForm character={editingChar} settings={settings} onSave={saveCharacter} onCancel={() => { setShowCharForm(false); setEditingChar(null); }} />}
    </div>
  );
}
